---
layout: default
---

<section class="home-intro">
  {{ content }}
</section>

{% if site.posts.size > 0 %}
<section class="post-list">
  <h2>Posts</h2>
  <ul>
    {% for post in site.posts %}
    <li>
      <article>
        <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%Y %m %d" }}</time>
        <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
      </article>
    </li>
    {% endfor %}
  </ul>
</section>
{% endif %}
