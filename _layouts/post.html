---
layout: default
---

<article class="post">
  <header class="post-header">
    {% if page.title %}
    <h1>{{ page.title }}</h1>
    {% endif %}
    {% if page.date %}
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
    {% endif %}
  </header>
  {{ content }}
</article>
